# Source of truth for the CV page (templates/cv.html).
#
# Each section has a `title` and either `text` or a list of `entries`, plus an
# optional `toc` label to use in the contents panel instead of the title.
# style = "citations" sets entry titles in regular weight, for works rather
# than roles.
# Entry fields (all optional, but give each entry a title or roles):
#   title    entry heading (markdown)
#   url      makes the title a link
#   date     when it happened, or a list of dates (see Dates below)
#   start, end   a span of time instead of `date`; end = "present" if ongoing
#   roles    several title/date rows sharing one entry, e.g. promotions
#   with     co-authors or collaborators
#   venue    publication venue or patent number (markdown)
#   place    organization and location (markdown)
#   note     extra line (markdown)
#   links    [{ label, url }] shown after the details
#   bullets  list of highlights (markdown)
# Sections with layout = "compact" render entries as a label/text list.
#
# Dates: "2017", "2020-05", "2020-05-28", or an academic term like
# "2017-fall". A section can set how its dates print with strftime-style codes
# (%Y year, %B month or term, %b short month, %m month number, %-d day):
#   date_format         timeline label, default "%Y"
#   date_detail_format  full date shown on hover, default "%B %-d, %Y"
#   date_prefix         word before the hover date, e.g. "Filed"
# Codes a date doesn't have are skipped, so "%B %-d, %Y" prints "May 2020"
# for "2020-05" and "Fall 2017" for "2017-fall".
# The ISO 8601-2 forms "2017-23" (Autumn 2017) and ".." (present) also work.

