place = "Immuta, Columbus, OH"
bullets = [
  "Pioneered cutting-edge SQL transformers for the integration of privacy mechanisms. Particularly, for rewriting aggregate queries to ensure differential privacy (US Patent 11,593,506, February 2023), and for achieving local differential privacy through randomized response (US Patent 11,783,077, October 2023).",
  "Led the architectural design and contributed to the development of a system that infers database column types from column data without requiring explicit transfer. Notably, this locality-preserving system works remotely over a sample, offering PAC-like robustness guarantees.",
  "Implemented critical cryptographic libraries, such as format-preserving encryption (FF1), order-preserving encryption (Boldyreva, Chenette, Lee, O'Neil), and AES.",
  "Advanced format-preserving encryption and randomized response techniques to finite regular languages. This was achieved by creating an efficient library to enumerate the accepting set of a regular expression, supporting conversion between an accepted value and its index in constant time for a fixed pattern.",
  "Developed effective best-effort solutions to hard combinatorial optimization problems such as reducing excess privilege in role-based access policies while simultaneously minimizing the number of replacement roles. (NP-hard to even approximate by reduction to boolean matrix factorization.)",
  "Conceived and implemented a unique clustering algorithm that leverages minimum capacity constraints for *k*-anonymization.",
  "Designed and implemented a novel one-pass streaming algorithm for constructing a *k*-anonymizing attribute suppression decision tree.",
  "Conceived, developed, and implemented a framework for differential data risk assessment enabling, e.g., detection of queries that would inadvertently re-identify de-identified data.",
  "Provided expert consultation to the company on modern best practices in mathematical privacy, including the application of differential privacy, zero-knowledge proofs, partially and fully homomorphic encryption, queries over encrypted data, and secure multi-party computation techniques.",
  "Authored numerous scholarly papers and guidance materials on the application of Privacy-Enhancing Technologies (PETs).",
  "Frequently served as an advisor to the UK Information Commissioner's Office (ICO) on the application of PETs, including active participation in the PETs Expert Forum (2021-2022) and PETs Expert Roundtable (September 9, 2019).",
]

