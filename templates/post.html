{% extends "base.html" %}

{% block title %}{{ title }} — {{ site_title }}{% endblock %}

{% block content %}
<article>
  <header>
    <h1>{{ title }}</h1>
    <time datetime="{{ date }}">{{ date }}</time>
    {% if tags %}
    <div class="tags">
      {% for tag in tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}
  </header>
  <div class="post-body">
    {{ body | safe }}
  </div>
</article>
{% endblock %}
