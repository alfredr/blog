{% extends "base.html" %}

{% block title %}{{ title }} — {{ site_title }}{% endblock %}

{% block content %}
<article>
  <h1>{{ title }}</h1>
  <div class="page-body{% block page_body_class %}{% endblock %}">
    {% block page_body %}{{ body | safe }}{% endblock %}
  </div>
</article>
{% endblock %}
