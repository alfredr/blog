<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-name">Signal Lab</span>
    <span class="doc-title" id="doc-title"></span>
  </div>
  <div class="toolbar" role="toolbar" aria-label="Diagram">
    <select id="examples" aria-label="Load an example">
      <option value="" selected disabled hidden>Examples…</option>
    </select>
    <button type="button" id="new">New</button>
    <button type="button" id="import">Open…</button>
    <button type="button" id="export">Save…</button>
    <span class="divider" aria-hidden="true"></span>
    <button type="button" id="undo" title="Undo (⌘Z)">Undo</button>
    <button type="button" id="redo" title="Redo (⇧⌘Z)">Redo</button>
    <button type="button" id="fit" title="Fit the diagram to the window">Fit</button>
  </div>
  <div class="layout-toggles" id="layout-toggles" role="group" aria-label="Layout"></div>
</header>
<main class="workspace" id="workspace">
  <div class="area area-blocks" id="blocks-area">
    <header class="area-head"><h2 class="area-title">Blocks</h2></header>
    <nav class="palette" id="palette" aria-label="Blocks"></nav>
  </div>
  <div class="center" id="center">
    <section class="canvas" id="canvas" aria-label="Diagram">
      <nav class="crumbs" id="crumbs" aria-label="Inside subsystem" hidden></nav>
    </section>
    <section class="face" id="face" aria-label="Panel face"></section>
  </div>
  <div class="area area-inspector" id="inspector-area">
    <header class="area-head"><h2 class="area-title">Inspector</h2></header>
    <aside class="inspector" id="inspector" aria-label="Settings"></aside>
  </div>
</main>
<footer class="statusbar">
  <p class="status" id="status" role="status" aria-live="polite"></p>
</footer>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<noscript><p class="noscript">Signal Lab runs in the browser and needs JavaScript.</p></noscript>
</body>
</html>
